name: Source CI

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private source commit SHA or ref to verify"
        required: true
        default: main
        type: string
  repository_dispatch:
    types: [source-ci]

permissions:
  contents: read

concurrency:
  group: source-ci-${{ inputs.source_ref || github.event.client_payload.source_ref || 'main' }}
  cancel-in-progress: true

jobs:
  verify-and-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: _src
    steps:
      - name: Checkout private source with read-only repository access
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: veildawn/conflux-service
          ref: ${{ inputs.source_ref || github.event.client_payload.source_ref || 'main' }}
          token: ${{ github.token }}
          ssh-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}
          path: _src
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: _src/go.mod
          cache: false

      - name: Verify T33 GPL license & package boundary
        run: sh scripts/release/verify-license-boundary.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.6.5

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Frontend typecheck, test, and build
        run: |
          pnpm --dir web install --frozen-lockfile
          node scripts/check-ui-consistency.mjs
          pnpm --dir web run typecheck
          pnpm --dir web run test
          pnpm --dir web run build

      - name: Expose PostgreSQL tools for integration tests
        run: |
          PG_BINDIR="$(pg_config --bindir)"
          test -x "$PG_BINDIR/initdb"
          test -x "$PG_BINDIR/pg_ctl"
          echo "$PG_BINDIR" >> "$GITHUB_PATH"

      - name: Verify optional Snell component and enable interoperability tests
        if: ${{ hashFiles('_src/runtime/internal/snell/component.go') != '' }}
        run: |
          (cd runtime && go build -o "${RUNNER_TEMP}/conflux-runtime" ./cmd/conflux-runtime)
          sudo "${RUNNER_TEMP}/conflux-runtime" snell-component --install
          version=$("${RUNNER_TEMP}/conflux-runtime" snell-component | jq -er .version)
          snell_bin=""
          for cand in "/var/lib/conflux/components/sing-box-${version}" "/usr/local/libexec/conflux/sing-box-${version}"; do
            if [ -x "$cand" ]; then
              snell_bin="$cand"
              break
            fi
          done
          test -n "$snell_bin"
          echo "CONFLUX_TEST_SNELL_BIN=${snell_bin}" >> "$GITHUB_ENV"

      - name: Run Go unit and integration tests
        run: |
          run_go_tests() {
            local source_dir="$1"
            local test_log="${RUNNER_TEMP}/source-ci-tests.json"
            if ! (cd "$source_dir" && go test -race -p 4 -count=1 -json ./...) > "$test_log"; then
              python3 - "$test_log" <<'PYTEST'
          import json, re, sys
          locations = {}
          for line in open(sys.argv[1]):
              try:
                  event = json.loads(line)
              except ValueError:
                  continue
              key = (event.get("Package", ""), event.get("Test", ""))
              # Only publish a test source location. Captured output can contain credentials.
              if event.get("Action") == "output":
                  match = re.match(r"^\s*([A-Za-z0-9_]+_test\.go:[0-9]+):", event.get("Output", ""))
                  if match:
                      locations[key] = match[1]
              if event.get("Action") == "fail":
                  print("::error::Go test failed: " + " ".join((*key, locations.get(key, ""))).strip())
          PYTEST
              rm -f "$test_log"
              return 1
            fi
            rm -f "$test_log"
          }
          run_go_tests .
          run_go_tests runtime

      - name: Cross-build Linux, macOS, and Windows binaries
        run: |
          for arch in amd64 arm64; do
            for bin in conflux-server conflux-agent conflux-updater conflux-ctl; do
              CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "/tmp/bin-${arch}/${bin}" "./cmd/${bin}"
            done
            (cd runtime && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -o "/tmp/bin-${arch}/conflux-runtime" ./cmd/conflux-runtime)
            CGO_ENABLED=0 GOOS=darwin GOARCH="$arch" go build -trimpath -o "/tmp/bin-darwin-${arch}/conflux-agent" ./cmd/conflux-agent
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -o "/tmp/bin-windows-${arch}/conflux-agent.exe" ./cmd/conflux-agent
          done

      - name: Scrub private checkout
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -rf _src
