services:
  postgres:
    image: ${CONFLUX_PG_IMAGE:-postgres:16.6-bookworm}
    container_name: conflux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-conflux}
      POSTGRES_USER: ${POSTGRES_USER:-conflux}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ulimits:
      core: 0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-conflux} -d ${POSTGRES_DB:-conflux}"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - conflux-internal

  conflux-server:
    image: ${CONFLUX_SERVER_IMAGE:-ghcr.io/veildawn/conflux-release:latest}
    container_name: conflux-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      core: 0
    environment:
      CONFLUX_LISTEN_ADDR: ":8080"
      CONFLUX_PUBLIC_BASE_URL: ${CONFLUX_PUBLIC_BASE_URL:?CONFLUX_PUBLIC_BASE_URL is required}
      CONFLUX_RULESET_PUBLIC_URL: ${CONFLUX_RULESET_PUBLIC_URL:-${CONFLUX_PUBLIC_BASE_URL}}
      CONFLUX_AGENT_CONNECT_URL: ${CONFLUX_AGENT_CONNECT_URL:-${CONFLUX_PUBLIC_BASE_URL}}
      CONFLUX_TRUSTED_PROXY_CIDRS: ${CONFLUX_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,172.16.0.0/12}
      CONFLUX_DATABASE_URL: "postgres://${POSTGRES_USER:-conflux}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-conflux}?sslmode=disable"
      CONFLUX_DATA_DIR: "/var/lib/conflux"
      CONFLUX_MASTER_KEY_HEX: ${CONFLUX_MASTER_KEY_HEX:?CONFLUX_MASTER_KEY_HEX is required}
      CONFLUX_MASTER_KEY_ID: ${CONFLUX_MASTER_KEY_ID:-mk_v1}
      CONFLUX_CONTROL_SIGNING_SEED_HEX: ${CONFLUX_CONTROL_SIGNING_SEED_HEX:-}
      CONFLUX_CYCLE_TIMEZONE: ${CONFLUX_CYCLE_TIMEZONE:-Asia/Shanghai}
      CONFLUX_SUB_RATE_LIMIT_PER_MIN: ${CONFLUX_SUB_RATE_LIMIT_PER_MIN:-30}
      CONFLUX_SUB_RATE_BURST: ${CONFLUX_SUB_RATE_BURST:-10}
    ports:
      - "${CONFLUX_BIND_IP:-127.0.0.1}:${CONFLUX_PORT:-8080}:8080"
    volumes:
      - conflux-data:/var/lib/conflux
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - conflux-internal

volumes:
  pgdata:
  conflux-data:

networks:
  conflux-internal:
    driver: bridge
